apiVersion: apps/v1
kind: Deployment
metadata:
  name: firefox-rdp
spec:
  replicas: 1
  strategy:
    type: Recreate          # all RDP sessions live inside this one pod
  selector:
    matchLabels:
      app: firefox-rdp
  template:
    metadata:
      labels:
        app: firefox-rdp
    spec:
      affinity:
        nodeAffinity:         # 優先排到 worker；單節點叢集也能排到 control-plane
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-role.kubernetes.io/control-plane
                operator: DoesNotExist
      containers:
      - name: desktop
        image: ghcr.io/braveantony/rdp-firefox:3.7-share
        imagePullPolicy: IfNotPresent
        # Runs as root: xrdp-sesman needs PAM and setuid to the login accounts.
        # Xorg, openbox and Firefox run as each account; the xrdp listener drops to user xrdp.
        securityContext:
          allowPrivilegeEscalation: false
        env:
        - name: MAX_SESSIONS        # 同時連線上限；每個 session 約 0.5 CPU、0.5–1 GiB
          value: "4"
        - name: SSH_TARGET          # 2210 終端機的 myssh 目標
          value: "tkadm.taroko"
        ports:
        - name: rdp
          containerPort: 3389
        readinessProbe:
          tcpSocket:
            port: rdp
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          tcpSocket:
            port: rdp
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:           # 依 MAX_SESSIONS=4 估算
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "4"
            memory: "4Gi"
        volumeMounts:
        - name: users          # 帳號清單：一行一個「帳號:密碼」
          mountPath: /etc/firefox-rdp
          readOnly: true
        - name: dshm
          mountPath: /dev/shm
      volumes:
      - name: users
        secret:
          secretName: firefox-rdp-users   # 由 kustomize secretGenerator 產生
          defaultMode: 0400
      - name: dshm             # container 預設 /dev/shm 只有 64MiB，Firefox 分頁容易崩潰
        emptyDir:
          medium: Memory
          sizeLimit: 1Gi
