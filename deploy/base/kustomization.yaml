# Base: Namespace, Deployment and NodePort Service (30389).
# The login accounts come from a Secret named firefox-rdp-users (key: users),
# generated by an overlay's secretGenerator; see ../example.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: web-workspace
resources:
- namespace.yaml
- deployment.yaml
- service.yaml
